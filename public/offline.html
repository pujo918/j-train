<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | J-TRAIN</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF7F2;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .badge {
      background-color: #FEE2E2;
      color: #B91C1C;
      font-weight: 700;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #4B5563;
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background-color: #B91C1C;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="badge">⛩️ J-TRAIN MAN 1 PASURUAN</div>
  <h1>Koneksi Sedang Terputus</h1>
  <p>Perangkat Anda sedang offline. Jawaban latihan Anda tetap aman tersimpan di memori browser. Silakan hubungkan kembali ke internet madrasah atau data seluler.</p>
  <button onclick="window.location.reload()">Coba Muat Ulang</button>
</body>
</html>
