<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightWashiBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172E" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#0B1224" stop-opacity="0.84" />
      <stop offset="100%" stop-color="#111C36" stop-opacity="0.88" />
    </linearGradient>

    <radialGradient id="sakuraCornerGlowTL" cx="10%" cy="14%" r="36%">
